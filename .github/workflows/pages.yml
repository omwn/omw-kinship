name: Deploy to GitHub Pages

# Serves docs/: the Cygnet web UI, with the databases from the latest release
# (kin-cygnet.db.gz, kin-provenance.db.gz), and the hierarchy browser.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the event payload on release: published to avoid a race if
          # another release publishes concurrently; fall back for workflow_dispatch.
          TAG="${{ github.event.release.tag_name }}"
          if [[ -z "$TAG" ]]; then
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache release databases
        id: cache-db
        uses: actions/cache@v4
        with:
          path: docs/*.db.gz
          key: release-db-${{ steps.release.outputs.tag }}

      - name: Download release databases
        if: steps.cache-db.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.release.outputs.tag }}" --repo ${{ github.repository }} --pattern "*.db.gz" --dir docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
